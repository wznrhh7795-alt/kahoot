<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Quizzone! – Entra in partita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Barra in alto durante il gioco -->
  <header id="topbar" class="topbar hidden">
    <span id="top-pin"></span>
    <span id="top-progress"></span>
  </header>

  <!-- 1. PIN -->
  <main id="s-pin" class="screen bg-pattern">
    <h1 class="logo">Quizzone!</h1>
    <form id="pin-form" class="card" autocomplete="off">
      <input id="pin-input" class="input" inputmode="numeric" placeholder="PIN del gioco" aria-label="PIN del gioco" maxlength="7">
      <button class="btn" type="submit">Entra</button>
    </form>
    <div id="pin-error" class="error hidden" role="alert"></div>
    <p class="footer-note">Vuoi organizzare una partita? <a href="/host">Crea il tuo quiz qui</a></p>
  </main>

  <!-- 2. Nickname -->
  <main id="s-nick" class="screen bg-pattern hidden">
    <h1 class="logo">Quizzone!</h1>
    <form id="nick-form" class="card" autocomplete="off">
      <input id="nick-input" class="input" placeholder="Nickname" aria-label="Nickname" maxlength="15">
      <button class="btn" type="submit">OK, via!</button>
    </form>
    <div id="nick-error" class="error hidden" role="alert"></div>
  </main>

  <!-- 3. Istruzioni / sala d'attesa -->
  <main id="s-lobby" class="screen hidden">
    <h2 class="big">Eccoti!</h2>
    <p>Vedi il tuo nickname sullo schermo?</p>
    <div class="spinner"></div>
  </main>

  <!-- 4. Preparati -->
  <main id="s-getready" class="screen hidden">
    <h2 id="gr-title" class="big">Domanda 1</h2>
    <div id="gr-count" class="countdown-ring">5</div>
    <p class="big">Preparati!</p>
  </main>

  <!-- 5. Domanda -->
  <main id="s-question" class="screen hidden" style="justify-content: stretch; padding: 8px;">
    <div id="answers" class="answer-grid player-answers"></div>
  </main>

  <!-- 6. Risposta inviata -->
  <main id="s-sent" class="screen hidden">
    <div class="spinner"></div>
    <h2 class="big">Risposta inviata</h2>
    <p id="sent-quip"></p>
  </main>

  <!-- 7. Risultato della domanda -->
  <main id="s-result" class="screen hidden">
    <h2 id="res-title" class="big"></h2>
    <div id="res-icon" class="result-icon"></div>
    <div id="res-streak" class="streak hidden"></div>
    <div id="res-points" class="points-box"></div>
    <p id="res-rank" class="big" style="font-size: 1.3rem"></p>
    <p id="res-behind"></p>
  </main>

  <!-- 8. Fine partita -->
  <main id="s-gameover" class="screen bg-pattern hidden">
    <h2 id="go-title" class="big"></h2>
    <div id="go-medal" style="font-size: 5rem"></div>
    <p id="go-rank" class="big"></p>
    <p id="go-score"></p>
    <a class="btn light" href="/">Gioca ancora</a>
  </main>

  <!-- Messaggi (espulso, host uscito...) -->
  <main id="s-message" class="screen bg-pattern hidden">
    <h2 id="msg-title" class="big"></h2>
    <p id="msg-body"></p>
    <a class="btn light" href="/">Torna all'inizio</a>
  </main>

  <footer id="bottombar" class="bottombar hidden">
    <span id="bb-nick"></span>
    <span id="bb-score" class="score-pill">0</span>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shapes.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
